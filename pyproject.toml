[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
requires-python = ">=3.14,<3.15"
name = "WebSys"
version = "0.1.0"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "uvicorn>=0.53.0",
]

[tool.setuptools.packages.find]
where = ["src"]
